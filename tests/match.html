<!doctype html>
<html lang="en"><meta charset="utf-8"><title>FC Stars match verification</title>
<style>body{font:15px system-ui;background:#111b21;color:#eef4ef;margin:24px}iframe{width:100%;height:640px;border:1px solid #426354}pre{white-space:pre-wrap}button{padding:12px;margin:12px 0}</style>
<h1>FC Stars match verification</h1>
<p>Use an isolated browser profile. Assertions use in-memory match fixtures; normal match play in the frame can save to that profile.</p>
<button id="run" disabled>Run regression checks</button><pre id="result">Loading game…</pre>
<iframe id="game" src="../index.html" title="Game under test"></iframe>
<script>
const game=document.querySelector('#game');
game.onload=()=>{for(const source of ['tests/match-tests.js','tests/game-tests.js']){const script=game.contentDocument.createElement('script');script.src=source;script.onload=()=>{if(game.contentWindow.runFCMatchTests&&game.contentWindow.runFCGameTests){document.querySelector('#run').disabled=false;document.querySelector('#result').textContent='Ready';}};game.contentDocument.body.append(script);}};
document.querySelector('#run').onclick=()=>{document.querySelector('#result').textContent=JSON.stringify({match:game.contentWindow.runFCMatchTests(),game:game.contentWindow.runFCGameTests()},null,2);};
</script></html>
